name: Upstream Sync

# Creates a reviewable draft PR that merges grafana/skills into this fork.
# Never auto-merges, and never advances UPSTREAM_BASE unless validation passes.

on:
  schedule:
    # Weekly, Monday 03:17 UTC — off the hour to avoid runner contention.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pyyaml==6.0.3

      - name: Configure git and upstream remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/grafana/skills.git || true

      - name: Run guarded sync
        id: sync
        continue-on-error: true
        run: |
          python scripts/sync-upstream.py \
            --upstream-ref upstream/main \
            --log sync-validation.log
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-validation
          path: sync-validation.log
          if-no-files-found: warn

      - name: Push branch and open draft PR
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "::notice::Already up to date with upstream"
            exit 0
          fi
          git push -u origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "chore(sync): merge upstream/main" \
            --body "Automated upstream sync. Fork workflow overrides restored and catalogs regenerated. Review the \`upstream-sync-validation\` artifact before marking ready."

      - name: Report failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Upstream sync validation failed; UPSTREAM_BASE was not advanced. See the upstream-sync-validation artifact."
          exit 1
