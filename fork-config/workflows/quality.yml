name: Fork Quality

# Fork replacement for the upstream Tessl skill-review workflow, which requires
# Grafana-internal Vault roles a fork cannot obtain. This runs entirely on the
# runner with no external service credentials.
#
# Canonical source: fork-config/workflows/quality.yml
# scripts/sync-upstream.py restores this file into .github/workflows/fork-quality.yml
# after every upstream merge; edit the canonical source, never the copy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --require-hashes --no-deps -r fork-config/requirements-ci.txt || python -m pip install pytest==9.1.1 pyyaml==6.0.3

      - name: Lint skills
        run: ./scripts/lint-skills.sh skills

      - name: Unit tests
        run: python -m pytest -q

      - name: Catalog is up to date
        run: python scripts/generate-catalog.py --check

      - name: Validate catalog
        run: python scripts/validate-catalog.py

      - name: On-prem boundary
        run: |
          python scripts/check-onprem-boundary.py \
            --policy catalog/onprem-policy.yaml \
            --marketplace .agents-plugin/marketplace.json \
            --scan skills/onprem-observability \
            --scan skills/onprem-observability-adapters \
            --scan skills/onprem-platform \
            --scan catalog/onprem-allowlist.json

      - name: Upstream boundary
        run: |
          python scripts/check-upstream-boundary.py \
            --base "$(cat UPSTREAM_BASE)" \
            --head HEAD
